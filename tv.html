<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PICALE · TV</title>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:wght@400;600&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box;}
:root{--green:#5EE87A;--display:'Bebas Neue',sans-serif;}
html,body{width:100%;height:100%;background:#000;overflow:hidden;color:#fff;font-family:'DM Sans',sans-serif;}
#video{width:100%;height:100%;object-fit:cover;display:block;}
#overlay{position:fixed;inset:0;pointer-events:none;transition:opacity 1s;}
#topbar{position:absolute;top:0;left:0;right:0;padding:24px 40px;display:flex;align-items:center;justify-content:space-between;background:linear-gradient(to bottom,rgba(0,0,0,.75) 0%,transparent 100%);}
.tv-logo{font-family:var(--display);font-size:40px;letter-spacing:4px;}
.tv-logo span{color:var(--green);}
.tv-court{font-family:var(--display);font-size:28px;letter-spacing:2px;color:rgba(255,255,255,.7);}
.tv-clock{font-family:var(--display);font-size:40px;letter-spacing:2px;}
#bottombar{position:absolute;bottom:0;left:0;right:0;padding:24px 40px;display:flex;align-items:center;justify-content:space-between;background:linear-gradient(to top,rgba(0,0,0,.75) 0%,transparent 100%);}
.live-badge{display:flex;align-items:center;gap:10px;background:rgba(0,0,0,.5);border:1px solid rgba(94,232,122,.3);border-radius:30px;padding:8px 24px;backdrop-filter:blur(8px);}
.live-dot{width:10px;height:10px;border-radius:50%;background:var(--green);animation:pulse 2s infinite;}
@keyframes pulse{0%,100%{opacity:1;}50%{opacity:.3;}}
.live-text{font-family:var(--display);font-size:22px;letter-spacing:3px;color:var(--green);}
.tv-url{font-family:var(--display);font-size:18px;letter-spacing:2px;color:rgba(255,255,255,.35);}
#loading{position:fixed;inset:0;background:#000;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:20px;z-index:100;}
.loading-logo{font-family:var(--display);font-size:80px;letter-spacing:8px;}
.loading-logo span{color:var(--green);}
.loading-sub{font-size:16px;color:rgba(255,255,255,.4);letter-spacing:2px;}
@keyframes spin{to{transform:rotate(360deg);}}
.spinner{width:36px;height:36px;border:3px solid rgba(255,255,255,.1);border-top-color:var(--green);border-radius:50%;animation:spin .8s linear infinite;}
#error{position:fixed;inset:0;background:#000;display:none;flex-direction:column;align-items:center;justify-content:center;gap:16px;}
.error-icon{font-size:64px;opacity:.25;}
.error-text{font-family:var(--display);font-size:36px;letter-spacing:2px;color:rgba(255,255,255,.4);}
.error-sub{font-size:14px;color:rgba(255,255,255,.25);letter-spacing:1px;}
</style>
</head>
<body>

<video id="video" autoplay muted playsinline></video>

<div id="overlay">
  <div id="topbar">
    <div class="tv-logo">PICALE<span>.</span></div>
    <div class="tv-court" id="court-name">EN VIVO</div>
    <div class="tv-clock" id="clock">--:--</div>
  </div>
  <div id="bottombar">
    <div class="live-badge">
      <div class="live-dot"></div>
      <div class="live-text">EN VIVO</div>
    </div>
    <div class="tv-url">picalereplay.com</div>
  </div>
</div>

<div id="loading">
  <div class="loading-logo">PICALE<span>.</span></div>
  <div class="spinner"></div>
  <div class="loading-sub">Conectando transmisión...</div>
</div>

<div id="error">
  <div class="error-icon">📡</div>
  <div class="error-text">STREAM NO DISPONIBLE</div>
  <div class="error-sub">Reintentando en 10 segundos...</div>
</div>

<script>
var params = new URLSearchParams(window.location.search);
var hlsUrl = params.get('hls') || '';
var courtName = params.get('name') || 'En Vivo';

document.getElementById('court-name').textContent = courtName.toUpperCase();

function tickClock() {
  var n = new Date();
  document.getElementById('clock').textContent =
    String(n.getHours()).padStart(2,'0') + ':' + String(n.getMinutes()).padStart(2,'0');
}
tickClock();
setInterval(tickClock, 1000);

var video = document.getElementById('video');
var loading = document.getElementById('loading');
var errEl = document.getElementById('error');
var hlsInstance = null;

function loadStream() {
  if (!hlsUrl) { loading.style.display='none'; errEl.style.display='flex'; return; }
  if (hlsInstance) { hlsInstance.destroy(); hlsInstance = null; }

  if (Hls.isSupported()) {
    hlsInstance = new Hls({lowLatencyMode:true, liveSyncDurationCount:3});
    hlsInstance.loadSource(hlsUrl);
    hlsInstance.attachMedia(video);
    hlsInstance.on(Hls.Events.MANIFEST_PARSED, function() {
      video.play();
      loading.style.display = 'none';
      errEl.style.display = 'none';
    });
    hlsInstance.on(Hls.Events.ERROR, function(e, data) {
      if (data.fatal) {
        loading.style.display = 'none';
        errEl.style.display = 'flex';
        setTimeout(function() {
          errEl.style.display = 'none';
          loading.style.display = 'flex';
          loadStream();
        }, 10000);
      }
    });
  } else if (video.canPlayType('application/vnd.apple.mpegurl')) {
    video.src = hlsUrl;
    video.addEventListener('loadedmetadata', function() { video.play(); loading.style.display='none'; });
  }
}

loadStream();

// Click para fullscreen
document.body.addEventListener('click', function() {
  if (!document.fullscreenElement) {
    document.documentElement.requestFullscreen && document.documentElement.requestFullscreen();
  }
});

// Auto-hide overlay
var overlay = document.getElementById('overlay');
var hideTimer;
function showOverlay() {
  overlay.style.opacity = '1';
  clearTimeout(hideTimer);
  hideTimer = setTimeout(function() { overlay.style.opacity = '0'; }, 5000);
}
document.addEventListener('mousemove', showOverlay);
showOverlay();
</script>
</body>
</html>
