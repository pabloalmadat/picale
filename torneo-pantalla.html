<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Torneo Inaugural · Somos Pádel</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box;}
  html,body{
    width:100%;height:100%;
    background:#0a0d0f;
    overflow:hidden;
  }
  .stage{
    width:100vw;height:100vh;
    display:flex;align-items:center;justify-content:center;
    /* leve resplandor de fondo con el amarillo Somos */
    background:radial-gradient(ellipse 70% 60% at 50% 50%, rgba(212,240,0,.05), transparent 70%), #0a0d0f;
  }
  .stage img{
    max-width:100%;
    max-height:100%;
    height:100vh;
    width:auto;
    object-fit:contain;
    display:block;
  }
</style>
</head>
<body>
  <div class="stage">
    <img src="/assets/torneo-inaugural.jpeg" alt="Torneo Inaugural Somos Pádel">
  </div>
</body>
</html>
