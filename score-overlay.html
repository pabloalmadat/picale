<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Marcador · Somos Pádel</title>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:wght@400;600;700&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
<style>
html,body{margin:0;padding:0;background:transparent;width:100vw;height:100vh;overflow:hidden;font-family:'DM Sans',sans-serif;}

#overlay{
  position:fixed;
  top:28px;
  left:28px;
  display:flex;
  flex-direction:column;
  gap:0;
  transition:opacity .4s;
}
#overlay.hidden{opacity:0;pointer-events:none;}

/* ── MAIN BOARD ── */
.board{
  display:flex;
  flex-direction:column;
  overflow:hidden;
  border-radius:3px;
  box-shadow:0 2px 24px rgba(0,0,0,.7);
  min-width:340px;
}

/* ── ROW ── */
.row{
  display:flex;
  align-items:stretch;
  height:38px;
}
.row:first-child{border-bottom:1px solid rgba(0,0,0,.15);}

/* Name section */
.name-section{
  background:rgba(22,22,22,.97);
  display:flex;
  align-items:center;
  gap:7px;
  padding:0 10px 0 8px;
  flex:1;
  min-width:0;
  position:relative;
}
/* serve indicator */
.serve{
  width:3px;
  height:65%;
  border-radius:2px;
  background:#D4E000;
  flex-shrink:0;
  opacity:0;
}
.row.serving .serve{opacity:1;}

.names{flex:1;min-width:0;}
.name1{
  font-size:13px;
  font-weight:700;
  color:#F0EDE6;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
  line-height:1.1;
  letter-spacing:.2px;
}
.name2{
  font-size:13px;
  font-weight:700;
  color:#F0EDE6;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
  line-height:1.1;
  margin-top:1px;
}

/* ── SCORE CELLS ── */
.cell{
  display:flex;
  align-items:center;
  justify-content:center;
  font-family:'JetBrains Mono',monospace;
  font-weight:700;
  flex-shrink:0;
  border-left:1px solid rgba(255,255,255,.06);
}

/* Past sets */
.set-cell{
  width:26px;
  font-size:15px;
  color:rgba(240,237,230,.55);
  background:rgba(28,28,28,.97);
}
.set-cell.won{color:#F0EDE6;}

/* Current games */
.games-cell{
  width:38px;
  font-size:22px;
  color:#F0EDE6;
  background:rgba(36,36,36,.97);
}
.games-cell.leading{color:#D4E000;}

/* Points */
.pts-cell{
  width:50px;
  font-size:18px;
  color:#F0EDE6;
  background:rgba(18,18,18,.97);
  border-left:1px solid rgba(212,224,0,.12);
}
.pts-cell.adv{color:#D4E000;font-size:12px;letter-spacing:1px;}
.pts-cell.leading{color:#D4E000;}

/* ── LOGOS BAR (below scoreboard) ── */
.logos-bar{
  display:flex;
  align-items:center;
  justify-content:space-between;
  background:rgba(8,8,8,.9);
  border-top:2px solid #D4E000;
  padding:4px 10px;
  gap:8px;
}
.logos-left{display:flex;align-items:center;gap:7px;}
.logo-img{height:16px;width:auto;object-fit:contain;}
.logo-div{width:1px;height:12px;background:rgba(212,224,0,.25);}
.live-badge{
  display:flex;align-items:center;gap:4px;
  font-size:9px;font-weight:700;letter-spacing:2px;
  color:rgba(240,237,230,.6);
}
.live-dot{width:5px;height:5px;border-radius:50%;background:#D4E000;animation:blink 1.5s infinite;}
@keyframes blink{0%,100%{opacity:1;}50%{opacity:.2;}}

/* ── TIEBREAK TAG ── */
.tb-tag{
  background:#D4E000;
  color:#000;
  font-size:8px;
  font-weight:700;
  letter-spacing:1.5px;
  padding:2px 6px;
  border-radius:2px;
  display:none;
}

/* ── SET FLASH ── */
.court-info{
  font-size:9px;
  font-weight:600;
  color:rgba(240,237,230,.5);
  letter-spacing:1px;
  white-space:nowrap;
}

.flash{
  position:fixed;
  top:28px;left:28px;
  background:#D4E000;
  color:#000;
  font-family:'Bebas Neue',sans-serif;
  font-size:26px;
  letter-spacing:3px;
  padding:10px 20px;
  border-radius:3px;
  opacity:0;
  transform:translateY(-6px);
  transition:all .25s;
  pointer-events:none;
  white-space:nowrap;
  box-shadow:0 4px 24px rgba(0,0,0,.6);
}
.flash.show{opacity:1;transform:translateY(0);}
</style>
</head>
<body>

<div id="overlay">
  <div class="board">
    <!-- ROW LEFT -->
    <div class="row" id="row-left">
      <div class="name-section">
        <div class="serve"></div>
        <div class="names">
          <div class="name1" id="n-l1">Leal</div>
          <div class="name2" id="n-l2">Guerrero</div>
        </div>
      </div>
      <div class="sets-history" id="sh-left" style="display:flex;"></div>
      <div class="cell games-cell" id="g-left">4</div>
      <div class="cell pts-cell" id="p-left">15</div>
    </div>
    <!-- ROW RIGHT -->
    <div class="row" id="row-right">
      <div class="name-section">
        <div class="serve"></div>
        <div class="names">
          <div class="name1" id="n-r1">Galán</div>
          <div class="name2" id="n-r2">Chingotto</div>
        </div>
      </div>
      <div class="sets-history" id="sh-right" style="display:flex;"></div>
      <div class="cell games-cell" id="g-right">3</div>
      <div class="cell pts-cell" id="p-right">30</div>
    </div>
  </div>

  <!-- LOGOS BAR -->
  <div class="logos-bar">
    <div class="logos-left">
      <img src="/assets/somos_padel.jpg" class="logo-img" alt="Somos Pádel" onerror="this.style.display='none'">
      <div class="logo-div"></div>
      <img src="/assets/picale_logo.png" class="logo-img" alt="Pícale" onerror="this.style.display='none'">
      <div class="logo-div"></div>
      <span class="court-info" id="court-info">Cancha 1 · Somos Pádel</span>
    </div>
    <div style="display:flex;align-items:center;gap:8px;">
      <div class="tb-tag" id="tb-tag">TIE-BREAK</div>
      <div class="live-badge"><div class="live-dot"></div>EN VIVO</div>
    </div>
  </div>
</div>

<div class="flash" id="flash"></div>

<script>
var CLOUD = 'https://api.picalereplay.com';
var matchId = new URLSearchParams(window.location.search).get('match_id');
var ws = null;
var prev = null;

var DEMO = {
  left_p1:'Jugador 1',left_p2:'Jugador 2',
  right_p1:'Jugador 3',right_p2:'Jugador 4',
  sets_left:0,sets_right:0,
  games_left:0,games_right:0,
  pts_left:'0',pts_right:'0',
  current_server:'left',
  in_tiebreak:false,
  sets_history:[],
  overlay_visible:true,
  status:'active',
  court_name:'Cancha 1',
  club_name:'Somos Pádel',
};

function connect() {
  if (!matchId) { render(DEMO); return; }
  fetch(CLOUD+'/api/v1/score/'+matchId)
    .then(function(r){return r.json();})
    .then(function(d){if(d.state)render(d.state);})
    .catch(function(){});
  var wsUrl = CLOUD.replace('https://','wss://').replace('http://','ws://')+'/api/v1/score/'+matchId+'/ws';
  ws = new WebSocket(wsUrl);
  ws.onmessage = function(e){
    var m = JSON.parse(e.data);
    if(m.type==='state_update'&&m.state) render(m.state);
  };
  ws.onclose = function(){ setTimeout(connect,3000); };
}

function render(s) {
  document.getElementById('overlay').classList.toggle('hidden', !s.overlay_visible);

  // Names
  document.getElementById('n-l1').textContent = s.left_p1||'';
  document.getElementById('n-l2').textContent = s.left_p2||'';
  document.getElementById('n-r1').textContent = s.right_p1||'';
  document.getElementById('n-r2').textContent = s.right_p2||'';

  // Server
  document.getElementById('row-left').classList.toggle('serving', s.current_server==='left');
  document.getElementById('row-right').classList.toggle('serving', s.current_server==='right');

  // Sets history
  var hist = s.sets_history||[];
  var totalCols = Math.max(hist.length+1, 2); // at least 2 cols
  var shL = '', shR = '';
  for(var i=0;i<totalCols;i++){
    if(i<hist.length){
      var wl=hist[i][0]>hist[i][1], wr=hist[i][1]>hist[i][0];
      shL+='<div class="cell set-cell'+(wl?' won':'')+'">'+hist[i][0]+'</div>';
      shR+='<div class="cell set-cell'+(wr?' won':'')+'">'+hist[i][1]+'</div>';
    } else if(i===hist.length){
      shL+='<div class="cell set-cell won" style="color:#D4E000">'+s.sets_left+'</div>';
      shR+='<div class="cell set-cell won" style="color:#D4E000">'+s.sets_right+'</div>';
    }
  }
  document.getElementById('sh-left').innerHTML=shL;
  document.getElementById('sh-right').innerHTML=shR;

  // Games
  var gl=document.getElementById('g-left'), gr=document.getElementById('g-right');
  gl.textContent=s.games_left; gr.textContent=s.games_right;
  gl.className='cell games-cell'+(s.games_left>s.games_right?' leading':'');
  gr.className='cell games-cell'+(s.games_right>s.games_left?' leading':'');

  // Points
  var pl=document.getElementById('p-left'), pr=document.getElementById('p-right');
  pl.textContent=s.pts_left; pr.textContent=s.pts_right;
  pl.className='cell pts-cell'+(s.pts_left==='ADV'?' adv':s.pts_left>s.pts_right&&s.pts_left!=='0'?' leading':'');
  pr.className='cell pts-cell'+(s.pts_right==='ADV'?' adv':s.pts_right>s.pts_left&&s.pts_right!=='0'?' leading':'');

  // Tiebreak
  document.getElementById('tb-tag').style.display=s.in_tiebreak?'block':'none';

  // Court / Club info
  var courtEl = document.getElementById('court-info');
  if (courtEl) {
    var parts = [];
    if (s.court_name) parts.push(s.court_name);
    if (s.club_name) parts.push(s.club_name);
    courtEl.textContent = parts.join(' · ') || 'Somos Pádel';
  }

  // Flash on set win
  if(prev){
    var ph=(prev.sets_history||[]).length, nh=(s.sets_history||[]).length;
    if(nh>ph){
      var last=s.sets_history[s.sets_history.length-1];
      var wname=last[0]>last[1]?(s.left_p1||'Equipo A'):(s.right_p1||'Equipo B');
      showFlash('SET · '+wname.split(' ')[0].toUpperCase()+' / '+(last[0]>last[1]?(s.left_p2||''):(s.right_p2||'')).split(' ')[0].toUpperCase());
    }
    if(s.status==='finished'&&prev.status!=='finished'){
      var sl=s.sets_left,sr=s.sets_right;
      var wn=sl>sr?(s.left_p1||'Equipo A'):(s.right_p1||'Equipo B');
      showFlash('🏆 '+wn.split(' ')[0].toUpperCase()+' / '+(sl>sr?(s.left_p2||''):(s.right_p2||'')).split(' ')[0].toUpperCase(),5000);
    }
  }
  prev = s;
}

function showFlash(text, dur) {
  dur = dur||3500;
  var f = document.getElementById('flash');
  document.getElementById('overlay').style.opacity='0';
  f.textContent = text;
  f.classList.add('show');
  setTimeout(function(){
    f.classList.remove('show');
    document.getElementById('overlay').style.opacity='1';
  }, dur);
}

connect();
</script>
</body>
</html>
