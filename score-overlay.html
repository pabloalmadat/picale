<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Overlay Marcador - PÍCALE</title>
<link href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Archivo:wght@600;700;800&display=swap" rel="stylesheet">
<style>
  :root{--yellow:#d4f000;--text:#f2f5f0;--muted:#aeb6b2;--bgcard:rgba(10,14,16,.82);--line:rgba(212,240,0,.22);--display:'Archivo Black',sans-serif;--body:'Archivo',sans-serif;}
  *{margin:0;padding:0;box-sizing:border-box;}
  html,body{background:transparent;font-family:var(--body);overflow:hidden;}
  .wrap{position:fixed;left:2.5%;bottom:6%;transition:opacity .4s;}
  .wrap.hidden{opacity:0;pointer-events:none;}
  .sb{background:var(--bgcard);border:1px solid var(--line);border-radius:12px;box-shadow:0 8px 40px rgba(0,0,0,.55);overflow:hidden;backdrop-filter:blur(4px);min-width:min(92vw,460px);}
  .sb-head{display:flex;align-items:center;justify-content:space-between;padding:7px 14px;background:rgba(0,0,0,.35);border-bottom:1px solid var(--line);}
  .sb-head .live{display:flex;align-items:center;gap:7px;font-size:12px;font-weight:800;color:var(--yellow);text-transform:uppercase;letter-spacing:.07em;}
  .sb-head .live .dot{width:8px;height:8px;border-radius:50%;background:#ff3b3b;animation:pulse 1.4s infinite;}
  @keyframes pulse{0%,100%{opacity:1;}50%{opacity:.25;}}
  .sb-head .cat{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.05em;}
  .sb-head .brand{font-family:var(--display);font-size:13px;color:var(--text);}
  table{border-collapse:collapse;width:100%;}
  td{padding:8px 8px;}
  .r{border-top:1px solid rgba(255,255,255,.06);}
  .r:first-child td{border-top:none;}
  .nm{font-size:17px;font-weight:800;color:var(--text);white-space:nowrap;padding-left:14px;min-width:190px;}
  .sd{display:inline-block;width:9px;height:9px;border-radius:50%;background:var(--yellow);margin-right:8px;vertical-align:middle;visibility:hidden;box-shadow:0 0 8px rgba(212,240,0,.7);}
  .r.serving .sd{visibility:visible;}
  .setv{font-family:var(--display);font-size:19px;color:var(--muted);text-align:center;width:34px;}
  .setv.win{color:var(--yellow);}
  .gm{font-family:var(--display);font-size:22px;color:var(--text);text-align:center;width:42px;background:rgba(255,255,255,.05);}
  .pt{font-family:var(--display);font-size:23px;color:#070a0c;text-align:center;width:56px;background:var(--yellow);}
  .hd td{font-size:9px;color:var(--muted);text-transform:uppercase;letter-spacing:.09em;text-align:center;padding:5px 8px 1px;font-weight:700;}
  .hd .nm{text-align:left;}
  .r.on-point .pt{box-shadow:inset 0 0 0 3px #fff;}
  .alert{margin-top:7px;padding:8px 14px;border-radius:9px;font-family:var(--display);font-size:14px;letter-spacing:.02em;display:none;align-items:center;gap:9px;background:var(--yellow);color:#070a0c;box-shadow:0 6px 24px rgba(0,0,0,.4);animation:slideIn .3s ease;}
  @keyframes slideIn{from{transform:translateY(8px);opacity:0;}to{transform:translateY(0);opacity:1;}}
  .alert.show{display:flex;}
  .alert.break{background:#ff9500;}
  .alert.set{background:var(--yellow);}
  .alert.match{background:#ff3b3b;color:#fff;}
  .alert.win{background:#fff;}
  .alert .who{font-family:var(--body);font-weight:700;font-size:12px;opacity:.85;}
  body.tb .pt{font-size:21px;}
</style>
</head>
<body>
<div class="wrap" id="wrap">
  <div class="sb">
    <div class="sb-head">
      <span class="live"><span class="dot"></span><span id="tag">En vivo</span></span>
      <span class="cat" id="cat">—</span>
      <span class="brand">PÍCALE</span>
    </div>
    <table>
      <tr class="hd"><td class="nm">&nbsp;</td><td>S1</td><td>S2</td><td>S3</td><td>JGS</td><td id="thpt">PTS</td></tr>
      <tr class="r" id="row-l">
        <td class="nm"><span class="sd"></span><span id="nm-l">Equipo A</span></td>
        <td class="setv" id="l-s1">–</td><td class="setv" id="l-s2">–</td><td class="setv" id="l-s3">–</td>
        <td class="gm" id="l-g">0</td><td class="pt" id="l-p">0</td>
      </tr>
      <tr class="r" id="row-r">
        <td class="nm"><span class="sd"></span><span id="nm-r">Equipo B</span></td>
        <td class="setv" id="r-s1">–</td><td class="setv" id="r-s2">–</td><td class="setv" id="r-s3">–</td>
        <td class="gm" id="r-g">0</td><td class="pt" id="r-p">0</td>
      </tr>
    </table>
  </div>
  <div class="alert" id="alert"><span id="al-text"></span><span class="who" id="al-who"></span></div>
</div>

<script>
var params = new URLSearchParams(location.search);
var matchId = params.get('match_id');
var courtId = params.get('court_id');   // alternativa: buscar match activo por cancha
var API = 'https://api.picalereplay.com/api/v1/score';

function qs(id){return document.getElementById(id);}

var prev = {l:{s:0,g:0,pt:'0'}, r:{s:0,g:0,pt:'0'}};

function render(s){
  if(!s){ return; }
  // overlay visible?
  qs('wrap').classList.toggle('hidden', s.overlay_visible===false || s.status==='finished' && false);
  qs('nm-l').textContent = ((s.left_p1||'')+' / '+(s.left_p2||'')).toUpperCase();
  qs('nm-r').textContent = ((s.right_p1||'')+' / '+(s.right_p2||'')).toUpperCase();
  qs('l-p').textContent = s.pts_left;
  qs('r-p').textContent = s.pts_right;
  qs('l-g').textContent = s.games_left;
  qs('r-g').textContent = s.games_right;
  qs('cat').textContent = (s.court_name||'')+(s.club_name?' · '+s.club_name:'');

  // sets history
  var hist = s.sets_history||[];
  for(var i=0;i<3;i++){
    var L=qs('l-s'+(i+1)), R=qs('r-s'+(i+1));
    if(hist[i]){
      L.textContent=hist[i].left; R.textContent=hist[i].right;
      L.classList.toggle('win', hist[i].left>hist[i].right);
      R.classList.toggle('win', hist[i].right>hist[i].left);
    } else { L.textContent='–'; R.textContent='–'; L.classList.remove('win'); R.classList.remove('win'); }
  }

  qs('row-l').classList.toggle('serving', s.current_server==='left');
  qs('row-r').classList.toggle('serving', s.current_server==='right');
  document.body.classList.toggle('tb', s.in_tiebreak);
  qs('thpt').textContent = s.in_tiebreak?'TB':'PTS';

  computeAlert(s);
}

// break / set / match point desde el estado
function computeAlert(s){
  var el=qs('alert');
  qs('row-l').classList.remove('on-point');
  qs('row-r').classList.remove('on-point');
  var al = detectAlert(s);
  if(al){
    el.className='alert show '+al.cls;
    qs('al-text').textContent=al.text;
    qs('al-who').textContent=al.who||'';
    if(al.side) qs('row-'+(al.side==='left'?'l':'r')).classList.add('on-point');
  } else { el.className='alert'; }
}

function ptVal(p){ // convierte "40","Ad","15" a numero para comparar
  if(p==='Ad') return 4; if(p==='40') return 3; if(p==='30') return 2; if(p==='15') return 1; return parseInt(p)||0;
}
function nameOf(s, side){ return side==='left'?((s.left_p1||'')+' / '+(s.left_p2||'')):((s.right_p1||'')+' / '+(s.right_p2||'')); }

function detectAlert(s){
  // match/set/break point calculado del estado del engine
  var pl=s.pts_left, pr=s.pts_right;
  function gamePoint(side){
    var me=side==='left'?pl:pr, op=side==='left'?pr:pl;
    if(s.in_tiebreak){ var m=parseInt(me)||0,o=parseInt(op)||0; return m>=(s.tb_target||7)-1 && m>o; }
    if(me==='Ad') return true;
    if(me==='40' && op!=='40' && op!=='Ad') return true;
    return false;
  }
  function willWinSet(side){
    if(!gamePoint(side)) return false;
    if(s.in_tiebreak) return true;
    var g=(side==='left'?s.games_left:s.games_right)+1, go=(side==='left'?s.games_right:s.games_left);
    return g>=6 && g-go>=2;
  }
  function setsOf(side){ return side==='left'?s.sets_left:s.sets_right; }
  function willWinMatch(side){ return willWinSet(side) && setsOf(side)===1; }
  function isBreak(side){ return gamePoint(side) && s.current_server!==side && !s.in_tiebreak; }

  for(var _i=0;_i<2;_i++){
    var side=_i===0?'left':'right';
    if(willWinMatch(side)) return {cls:'match',text:'Match point',who:nameOf(s,side),side:side};
  }
  for(var _j=0;_j<2;_j++){
    var side2=_j===0?'left':'right';
    if(willWinSet(side2)) return {cls:'set',text:'Set point',who:nameOf(s,side2),side:side2};
  }
  for(var _k=0;_k<2;_k++){
    var side3=_k===0?'left':'right';
    if(isBreak(side3)) return {cls:'break',text:'Break point',who:nameOf(s,side3),side:side3};
  }
  return null;
}

// ── conexión: WebSocket + fallback ──
var ws=null;
function connectWS(id){
  try{
    ws=new WebSocket('wss://api.picalereplay.com/api/v1/score/'+id+'/ws');
    ws.onmessage=function(e){ try{var m=JSON.parse(e.data); if(m.state) render(m.state);}catch(_){} };
    ws.onclose=function(){ setTimeout(function(){connectWS(id);}, 2000); };
  }catch(e){ setTimeout(function(){connectWS(id);},2000); }
}
async function loadOnce(id){
  try{ var r=await fetch(API+'/'+id); var d=await r.json(); if(d.state) render(d.state); }catch(e){}
}

async function init(){
  if(!matchId && courtId){
    // buscar match activo de la cancha
    try{
      var r=await fetch(API+'/court/'+courtId+'/active');
      var d=await r.json();
      if(d.match_id){ matchId=d.match_id; if(d.state) render(d.state); }
    }catch(e){}
  }
  if(matchId){ loadOnce(matchId); connectWS(matchId); }
}
init();
// si se pasó court_id, re-chequear cada 20s por si empieza un match nuevo
if(!matchId && courtId){ setInterval(init, 20000); }
</script>
</body>
</html>
