  *{margin:0;padding:0;box-sizing:border-box;}

  .stage{min-height:100vh;padding:4vh 4vw;background:

  .header h1{font-family:var(--display);font-style:italic;font-size:6vh;line-height:.9;text-transform:uppercase;color:var(--yellow);transform:skewX(-5deg);text-shadow:0 0 4vh rgba(212,240,0,.25);}
  .header .fecha{display:inline-block;margin-top:1.4vh;background:var(--yellow);color:#070a0c;font-weight:800;font-size:1.8vh;letter-spacing:.1vw;text-transform:uppercase;padding:.6vh 1.6vw;transform:skewX(-5deg);}
  .header .fecha span{display:inline-block;transform:skewX(5deg);}

  .hora-bloque{margin-bottom:2.4vh;}
  .hora-tit{display:flex;align-items:center;gap:1.2vw;margin-bottom:1.2vh;}
  .hora-tit .h{font-family:var(--display);font-size:2.6vh;color:var(--yellow);white-space:nowrap;}
  .hora-tit .linea{flex:1;height:2px;background:var(--line);}

  .grid{display:grid;grid-template-columns:repeat(2,1fr);gap:1vw 1.5vw;}
  .partido{background:var(--bg2);border:1px solid var(--line);border-left:3px solid var(--yellow);border-radius:.8vh;padding:1.3vh 1.4vw;display:flex;align-items:center;gap:1.2vw;}
  .partido .cancha-box{text-align:center;flex-shrink:0;min-width:5vw;}
  .partido .cancha-box .c{font-family:var(--display);font-size:1.8vh;color:var(--yellow);line-height:1;}
  .partido .cancha-box .p{font-size:1vh;color:var(--muted);text-transform:uppercase;margin-top:.3vh;}
  .partido .info{flex:1;min-width:0;}
  .partido .cat{font-size:1.1vh;color:var(--muted);text-transform:uppercase;letter-spacing:.08vw;margin-bottom:.4vh;}
  .partido .eqs{font-size:1.55vh;font-weight:700;line-height:1.35;}
  .partido .eqs .vs{color:var(--yellow);font-size:1.1vh;font-weight:800;margin:0 .4vw;}

  .footer{text-align:center;margin-top:3vh;padding-top:2vh;border-top:1px solid var(--line);}
  .footer .wa{font-size:1.5vh;color:var(--text);}
  .footer .wa b{color:var(--yellow);}
  .footer .by{font-size:1.2vh;color:var(--muted);letter-spacing:.15vw;text-transform:uppercase;margin-top:.6vh;}
  .footer .by b{color:var(--yellow);font-family:var(--display);}
</style>
