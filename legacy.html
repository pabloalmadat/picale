<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Noche de Box · Pícale</title>
<link href="legacy/fonts/fonts.css" rel="stylesheet">
<script src="legacy/config.js"></script>
<style>
  :root{--bg:#0a0a0c;--card:#141418;--line:#26262d;--txt:#f1ece0;--mut:#9b978d;--rojo:#e3262f;--rojo2:#8f0f15;--azul:#1d63c9;--oro:#e8b84a}
  *{box-sizing:border-box;margin:0;padding:0}
  body{background:var(--bg);color:var(--txt);font-family:Barlow,system-ui,sans-serif;min-height:100vh}
  .d{font-family:'Bebas Neue',Impact,sans-serif;letter-spacing:.02em;font-weight:400}
  a{color:inherit}
  .wrap{max-width:1180px;margin:0 auto;padding:0 16px}

  header{border-bottom:1px solid var(--line);background:rgba(10,10,12,.9);position:sticky;top:0;z-index:5;backdrop-filter:blur(8px)}
  header .wrap{display:flex;align-items:center;justify-content:space-between;height:64px}
  header img{height:24px}
  header .brand-txt{font-size:26px}
  .live{display:flex;align-items:center;gap:8px;background:var(--rojo);padding:6px 12px;border-radius:4px;font-weight:700;font-size:13px;letter-spacing:.12em}
  .live i{width:8px;height:8px;border-radius:50%;background:#fff;animation:p 1.4s infinite}
  @keyframes p{50%{opacity:.25}}

  .hero{padding:36px 0 22px;background:radial-gradient(ellipse at 50% -20%,rgba(143,15,21,.55),transparent 65%)}
  .kick{color:var(--oro);font-weight:700;letter-spacing:.3em;font-size:13px}
  h1{font-size:clamp(52px,9vw,104px);line-height:.9;margin:8px 0 6px}
  .meta{color:var(--mut);font-size:16px}

  .livewrap{margin-top:24px;display:grid;grid-template-columns:minmax(0,1fr);gap:12px}
  .livewrap .chat{display:none}
  .livewrap.conChat .chat{display:block;height:440px;border:1px solid var(--line);border-radius:10px;overflow:hidden;background:#18181b}
  .livewrap .chat iframe{width:100%;height:100%;border:0;display:block}
  @media (min-width:1000px){
    .livewrap.conChat{grid-template-columns:minmax(0,1fr) 340px}
    .livewrap.conChat .chat{height:auto}
  }
  .player{background:#000;border:1px solid var(--line);border-radius:10px;overflow:hidden}
  .player .ratio{position:relative;padding-top:56.25%}
  .player iframe,.player .empty{position:absolute;inset:0;width:100%;height:100%;border:0}
  .player .empty{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;color:var(--mut);text-align:center;padding:20px}
  .player .empty b{color:var(--txt);font-size:34px}
  .pbar{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 16px;border-top:1px solid var(--line);background:var(--card);flex-wrap:wrap}
  .pbar .t{font-size:26px}
  .pbar .t span{color:var(--oro)}
  .btn{background:transparent;border:1px solid var(--line);color:var(--txt);padding:9px 14px;border-radius:6px;font:600 14px Barlow,sans-serif;cursor:pointer}
  .btn:hover{border-color:var(--oro)}
  .btn.red{background:var(--rojo);border-color:var(--rojo)}

  section{padding:34px 0}
  .sh{display:flex;align-items:baseline;justify-content:space-between;margin-bottom:16px;gap:12px;flex-wrap:wrap}
  .sh h2{font-size:44px}
  .sh p{color:var(--mut)}
  .filters{display:flex;gap:8px}
  .filters .btn.on{background:var(--oro);color:#111;border-color:var(--oro)}

  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:12px}
  .fight{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:16px;display:flex;flex-direction:column;gap:14px;transition:border-color .2s,transform .2s}
  .fight:hover{border-color:#3a3a44}
  .fight.playing{border-color:var(--oro);box-shadow:0 0 0 1px var(--oro) inset}
  .fight .top{display:flex;justify-content:space-between;align-items:center;font-size:13px;letter-spacing:.14em;font-weight:700}
  .fight .top .no{color:var(--oro)}
  .tag{padding:3px 8px;border-radius:3px;font-size:11px}
  .tag.ok{background:rgba(232,184,74,.15);color:var(--oro)}
  .tag.wait{background:#222228;color:var(--mut)}
  .vsrow{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:10px}
  .vsrow .a{text-align:right;font-size:32px;border-right:3px solid var(--rojo);padding-right:10px}
  .vsrow .b{font-size:32px;border-left:3px solid var(--azul);padding-left:10px}
  .vsrow .v{color:var(--mut);font-size:18px}
  .fight .btn{width:100%}
  .fight .btn:disabled{opacity:.4;cursor:not-allowed}

  .logos{border-top:1px solid var(--line)}
  .logos .row{display:flex;flex-wrap:wrap;align-items:center;justify-content:center;gap:40px 56px;padding:10px 0 20px}
  .logos img{max-height:56px;max-width:170px;object-fit:contain;opacity:.85}
  footer{border-top:1px solid var(--line);padding:22px 0;color:var(--mut);font-size:13px;text-align:center}

  @media (max-width:520px){
    .vsrow .a,.vsrow .b{font-size:26px}
    .sh h2{font-size:36px}
  }
</style>
</head>
<body>

<header>
  <div class="wrap">
    <div><img id="hLogo" alt="Pícale"><span class="brand-txt d" id="hTxt" style="display:none">PÍCALE</span></div>
    <div class="live" id="liveTag"><i></i>EN VIVO</div>
  </div>
</header>

<div class="hero">
  <div class="wrap">
    <div class="kick" id="sub"></div>
    <h1 class="d" id="evName"></h1>
    <div class="meta" id="meta"></div>

    <div class="livewrap" id="liveWrap">
      <div class="player">
        <div class="ratio" id="stage"></div>
        <div class="pbar">
          <div class="t d" id="nowTitle"></div>
          <button class="btn red" id="backLive" style="display:none">● Volver al en vivo</button>
        </div>
      </div>
      <div class="chat" id="chat"></div>
    </div>
  </div>
</div>

<section>
  <div class="wrap">
    <div class="sh">
      <div><h2 class="d">Cartelera y replays</h2><p id="count"></p></div>
      <div class="filters">
        <button class="btn on" data-f="all">Todas</button>
        <button class="btn" data-f="ok">Con replay</button>
      </div>
    </div>
    <div class="grid" id="grid"></div>
  </div>
</section>

<section class="logos" id="logosSec">
  <div class="wrap">
    <div class="sh" style="justify-content:center"><div class="kick">CON EL APOYO DE</div></div>
    <div class="row" id="logos"></div>
  </div>
</section>

<footer>Transmisión y replays por Pícale</footer>

<script>
const E = window.EVENTO, C = window.CARTELERA, $ = (id) => document.getElementById(id);
let filtro = "all", actual = null;

document.title = `${E.nombre} · Pícale`;
if (E.logoEvento) {
  const img = new Image(); img.src = E.logoEvento; img.alt = E.nombre;
  img.style.cssText = "max-height:150px;max-width:min(520px,90%);display:block;margin:6px 0 4px";
  img.onerror = () => { $("evName").textContent = E.nombre; };
  $("evName").appendChild(img);
} else $("evName").textContent = E.nombre;
$("sub").textContent = (E.subtitulo || "").toUpperCase();
$("meta").textContent = [E.fecha, E.sede, `${C.length} peleas`].filter(Boolean).join("  ·  ");
$("hLogo").src = E.logoPrincipal;
$("hLogo").onerror = () => { $("hLogo").style.display = "none"; $("hTxt").style.display = "inline"; };

// ---------- Twitch / YouTube: convierte cualquier link normal en reproductor ----------
const HOST = location.hostname || "localhost";   // Twitch exige el dominio de la página
const CANAL = (E.twitchCanal || "").trim().replace(/^.*twitch\.tv\//i, "").replace(/[\/?#].*$/, "");

function embed(u){
  if (!u) return "";
  let m;
  if ((m = u.match(/clips\.twitch\.tv\/(?:embed\?clip=)?([\w-]+)/i)) || (m = u.match(/twitch\.tv\/[\w]+\/clip\/([\w-]+)/i)))
    return `https://clips.twitch.tv/embed?clip=${m[1]}&parent=${HOST}&autoplay=true`;
  if ((m = u.match(/twitch\.tv\/videos\/(\d+)/i))) {
    const t = (u.match(/[?&]t=([\dhms]+)/i) || [])[1];
    return `https://player.twitch.tv/?video=${m[1]}&parent=${HOST}&autoplay=true${t ? "&time=" + t : ""}`;
  }
  if ((m = u.match(/(?:youtu\.be\/|youtube\.com\/(?:watch\?v=|embed\/|live\/|shorts\/))([\w-]{11})/i)))
    return `https://www.youtube.com/embed/${m[1]}?autoplay=1`;
  return u;
}
const LIVE = CANAL ? `https://player.twitch.tv/?channel=${CANAL}&parent=${HOST}&autoplay=true` : embed(E.urlEnVivo);

// Chat de Twitch
if (CANAL && E.twitchChat !== false) {
  document.getElementById("liveWrap").classList.add("conChat");
  document.getElementById("chat").innerHTML =
    `<iframe src="https://www.twitch.tv/embed/${CANAL}/chat?parent=${HOST}&darkpopout" title="Chat en vivo"></iframe>`;
}

function play(url, titulo, fightN){
  actual = fightN;
  if (url) {
    $("stage").innerHTML = `<iframe src="${embed(url)}" allow="autoplay; fullscreen; picture-in-picture" allowfullscreen></iframe>`;
  } else {
    $("stage").innerHTML = `<div class="empty"><b class="d">La transmisión comienza pronto</b>Quédate en esta página; el video aparecerá aquí.</div>`;
  }
  $("nowTitle").innerHTML = titulo;
  $("backLive").style.display = fightN ? "inline-block" : "none";
  $("liveTag").style.visibility = fightN ? "hidden" : "visible";
  renderGrid();
}

function playLive(){ play(LIVE, `<span>EN VIVO</span> · ${E.nombre}`, null); }

function renderGrid(){
  const list = C.filter(f => filtro === "all" || f.replay);
  const conReplay = C.filter(f => f.replay).length;
  $("count").textContent = `${C.length} peleas · ${conReplay} replay${conReplay === 1 ? "" : "s"} disponible${conReplay === 1 ? "" : "s"}`;
  $("grid").innerHTML = list.length ? list.map(f => `
    <div class="fight ${actual === f.n ? "playing" : ""}">
      <div class="top"><span class="no">PELEA ${f.n}</span>
        <span class="tag ${f.replay ? "ok" : "wait"}">${f.replay ? "REPLAY" : "PRÓXIMAMENTE"}</span></div>
      <div class="vsrow"><div class="a d">${f.a}</div><div class="v d">VS</div><div class="b d">${f.b}</div></div>
      <button class="btn" data-n="${f.n}" ${f.replay ? "" : "disabled"}>${actual === f.n ? "Reproduciendo" : f.replay ? "▶ Ver replay" : "Replay no disponible aún"}</button>
    </div>`).join("") : `<p style="color:var(--mut)">Aún no hay replays publicados.</p>`;
  document.querySelectorAll("#grid button[data-n]").forEach(b => b.onclick = () => {
    const f = C.find(x => x.n === +b.dataset.n);
    play(f.replay, `<span>PELEA ${f.n}</span> · ${f.a} VS ${f.b}`, f.n);
    window.scrollTo({ top: 0, behavior: "smooth" });
  });
}

document.querySelectorAll(".filters .btn").forEach(b => b.onclick = () => {
  filtro = b.dataset.f;
  document.querySelectorAll(".filters .btn").forEach(x => x.classList.toggle("on", x === b));
  renderGrid();
});
$("backLive").onclick = playLive;

// Logos: solo se muestran los archivos que existen
(function(){
  const L = window.LOGOS || []; let ok = 0;
  if (!L.length) { $("logosSec").style.display = "none"; return; }
  L.forEach(l => {
    const im = new Image(); im.alt = l.nombre;
    im.onload = () => { $("logos").appendChild(im); ok++; };
    im.src = l.archivo;
  });
  setTimeout(() => { if (!ok) $("logosSec").style.display = "none"; }, 3000);
})();

// ?pelea=N abre directo el replay de esa pelea (para compartir links)
const qp = +new URLSearchParams(location.search).get("pelea");
const fq = C.find(x => x.n === qp && x.replay);
fq ? play(fq.replay, `<span>PELEA ${fq.n}</span> · ${fq.a} VS ${fq.b}`, fq.n) : playLive();
</script>
</body>
</html>
