# PÍCALE AI · se levanta junto a tus contenedores actuales, en la misma red de Docker.
# Cambia "RED_DE_PICALE" por la red donde está picale-api (ver INSTALAR.md, paso 2).
services:
  picale-ai:
    build: .
    container_name: picale-ai
    restart: unless-stopped
    env_file: .env
    volumes:
      - ./data:/data
    networks: [picale]
networks:
  picale:
    external: true
    name: RED_DE_PICALE
