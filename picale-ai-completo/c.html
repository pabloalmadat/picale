<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>PÍCALE · Analiza tu partido</title>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:wght@400;600;700&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{min-height:100vh;background:#0A0A0A;color:#F0EDE6;font-family:'DM Sans',sans-serif;display:flex;align-items:center;justify-content:center;padding:24px}
.w{max-width:380px;width:100%;text-align:center}
.logo{font-family:'Bebas Neue',sans-serif;font-size:52px;letter-spacing:4px}.logo span{color:#5EE87A}
h1{font-family:'Bebas Neue',sans-serif;font-size:30px;letter-spacing:1px;font-weight:400;margin:26px 0 8px}
p{color:rgba(240,237,230,.6);font-size:15px;line-height:1.5}
a.btn{display:block;margin-top:14px;height:54px;line-height:54px;border-radius:14px;font-weight:700;text-decoration:none}
.g{background:#5EE87A;color:#0A0A0A}.o{background:#1A1A1A;color:#F0EDE6;border:1px solid rgba(255,255,255,.16)}
</style>
</head>
<body>
<div class="w">
  <div class="logo">PÍ<span>CALE</span></div>
  <h1>Analiza tu partido con IA</h1>
  <p>Escaneaste el QR de una cancha PÍCALE. Inicia sesión y graba tu partido para analizarlo con IA.</p>
  <a class="btn g" id="web" href="/ai/#/partido">Analizar mi partido</a>
  <!-- Cuando la app esté en las tiendas: APP_PUBLISHED = true y poner los links reales -->
  <a class="btn o" id="open" href="#" style="display:none">Abrir en la app</a>
  <a class="btn o" id="ios" href="https://apps.apple.com/" style="display:none">Descargar para iPhone</a>
  <a class="btn o" id="android" href="https://play.google.com/store" style="display:none">Descargar para Android</a>
</div>
<script>
  var APP_PUBLISHED = false;
  // /c/<código> → la app web con el código; el servidor confirma qué cancha es.
  var code = (location.pathname.split('/c/')[1] || '').replace(/[^A-Za-z0-9]/g, '');
  document.getElementById('web').href = code ? '/ai/?qr=' + encodeURIComponent(code) + '#/partido' : '/ai/#/partido';
  if (APP_PUBLISHED) {
    var deep = 'picale://c/' + encodeURIComponent(code);
    ['open', 'ios', 'android'].forEach(function (id) { document.getElementById(id).style.display = 'block'; });
    document.getElementById('open').href = deep;
    setTimeout(function () { location.href = deep; }, 300);
  }
</script>
</body>
</html>
