<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Somos Pádel · Estado de Canchas</title>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:wght@300;400;500;600;700&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --yellow:#D4E000;
    --black:#0A0A0A;
    --white:#F0EDE6;
    --muted:rgba(240,237,230,.5);
    --faint:rgba(240,237,230,.08);
    --display:'Bebas Neue',sans-serif;
    --body:'DM Sans',sans-serif;
    --mono:'JetBrains Mono',monospace;
    --libre:#5fb87a;
    --reserva:#8b93f0;
    --clase:#35c5e0;
    --partido:var(--yellow);
    --torneo:#ff9838;
    --live:var(--yellow);
    --error:#e0556a;
  }
  *{margin:0;padding:0;box-sizing:border-box;}
  body{
    background:var(--black);color:var(--white);font-family:var(--body);
    min-height:100vh;padding:24px;
  }

  /* Top bar */
  .topbar{
    display:flex;align-items:center;justify-content:space-between;
    padding-bottom:20px;border-bottom:1px solid var(--faint);margin-bottom:20px;
    flex-wrap:wrap;gap:16px;
  }
  .brand{display:flex;align-items:center;gap:16px;}
  .brand-title{font-family:var(--display);font-size:34px;letter-spacing:3px;color:var(--white);line-height:1;}
  .brand-sub{font-size:12px;letter-spacing:3px;color:var(--yellow);text-transform:uppercase;margin-top:2px;}
  .topright{display:flex;align-items:center;gap:24px;}
  .clock{font-family:var(--mono);font-size:26px;color:var(--white);}
  .refresh-box{display:flex;align-items:center;gap:10px;font-size:12px;color:var(--muted);letter-spacing:1px;}
  .refresh-dot{width:8px;height:8px;border-radius:50%;background:var(--libre);box-shadow:0 0 8px var(--libre);}
  .btn{
    background:transparent;border:1px solid var(--faint);color:var(--white);
    font-family:var(--body);font-size:12px;letter-spacing:1px;text-transform:uppercase;
    padding:8px 14px;border-radius:6px;cursor:pointer;transition:.15s;
  }
  .btn:hover{border-color:var(--yellow);color:var(--yellow);}

  /* Summary chips */
  .summary{display:flex;gap:12px;margin-bottom:22px;flex-wrap:wrap;}
  .chip{
    display:flex;align-items:center;gap:10px;background:rgba(255,255,255,.02);
    border:1px solid var(--faint);border-radius:8px;padding:10px 16px;
  }
  .chip-dot{width:10px;height:10px;border-radius:50%;}
  .chip-num{font-family:var(--mono);font-size:20px;font-weight:700;}
  .chip-label{font-size:11px;letter-spacing:1px;color:var(--muted);text-transform:uppercase;}

  /* Grid */
  .grid{
    display:grid;grid-template-columns:repeat(2,1fr);gap:16px;
  }
  @media(max-width:820px){.grid{grid-template-columns:1fr;}}

  .card{
    position:relative;background:rgba(255,255,255,.02);
    border:1px solid var(--faint);border-radius:12px;padding:20px 20px 20px 24px;
    overflow:hidden;transition:.15s;
    display:flex;flex-direction:column;
  }
  .card:hover{border-color:rgba(212,224,0,.2);}
  .card::before{
    content:'';position:absolute;left:0;top:0;bottom:0;width:5px;background:var(--muted);
  }
  .card.libre::before{background:var(--libre);}
  .card.reserva::before{background:var(--reserva);}
  .card.clase::before{background:var(--clase);}
  .card.partido::before{background:var(--partido);}
  .card.torneo::before{background:var(--torneo);}
  .card.live::before{background:var(--live);}
  .card.error::before{background:var(--error);}
  .card.loading::before{background:var(--muted);}

  .card-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px;}
  .card-court{font-family:var(--display);font-size:30px;letter-spacing:2px;color:var(--white);line-height:1;}

  .badge{
    display:inline-flex;align-items:center;gap:7px;
    font-size:11px;font-weight:700;letter-spacing:1.5px;text-transform:uppercase;
    padding:5px 11px;border-radius:20px;
  }
  .badge-dot{width:7px;height:7px;border-radius:50%;}
  .badge.libre{color:var(--libre);background:rgba(95,184,122,.1);}
  .badge.libre .badge-dot{background:var(--libre);}
  .badge.reserva{color:var(--reserva);background:rgba(139,147,240,.12);}
  .badge.reserva .badge-dot{background:var(--reserva);}
  .badge.clase{color:var(--clase);background:rgba(53,197,224,.1);}
  .badge.clase .badge-dot{background:var(--clase);}
  .badge.partido{color:var(--partido);background:rgba(212,224,0,.1);}
  .badge.partido .badge-dot{background:var(--partido);}
  .badge.torneo{color:var(--torneo);background:rgba(255,152,56,.12);}
  .badge.torneo .badge-dot{background:var(--torneo);}
  .badge.live{color:var(--black);background:var(--yellow);}
  .badge.live .badge-dot{background:var(--black);animation:pulse 1.1s infinite;}
  .badge.error{color:var(--error);background:rgba(224,85,106,.12);}
  .badge.error .badge-dot{background:var(--error);}
  .badge.loading{color:var(--muted);background:rgba(255,255,255,.04);}
  .badge.loading .badge-dot{background:var(--muted);animation:pulse 1.1s infinite;}
  @keyframes pulse{0%,100%{opacity:1;}50%{opacity:.25;}}

  .card-body{flex:1;display:flex;flex-direction:column;justify-content:center;gap:6px;}
  .card-primary{font-size:16px;font-weight:600;color:var(--white);line-height:1.3;}
  .card-secondary{font-size:13px;color:var(--muted);line-height:1.4;}
  .card-players{display:flex;flex-wrap:wrap;gap:6px;margin-top:2px;}
  .player-tag{font-size:12px;color:var(--white);background:rgba(255,255,255,.05);padding:3px 9px;border-radius:5px;}

  .card-foot{
    display:flex;align-items:center;justify-content:space-between;
    margin-top:14px;padding-top:12px;border-top:1px solid var(--faint);
    font-size:11px;color:var(--muted);letter-spacing:.5px;
  }
  .card-link{color:var(--muted);text-decoration:none;transition:.15s;}
  .card:hover .card-link{color:var(--yellow);}

  /* Agenda del día */
  .agenda{margin-top:14px;padding-top:12px;border-top:1px solid var(--faint);}
  .agenda-title{font-size:10px;letter-spacing:2px;color:var(--muted);text-transform:uppercase;margin-bottom:10px;}
  .next-empty{font-size:12px;color:rgba(240,237,230,.3);font-style:italic;}

  .ag-row{
    border:1px solid var(--faint);border-radius:8px;padding:10px 12px;margin-bottom:8px;
    cursor:pointer;transition:.15s;background:rgba(255,255,255,.015);
  }
  .ag-row:last-child{margin-bottom:0;}
  .ag-row:hover{border-color:rgba(255,255,255,.14);}
  .ag-row.past{opacity:.62;}
  .ag-row.live{border-color:rgba(212,224,0,.35);background:rgba(212,224,0,.05);}
  .ag-row.cancel{opacity:.4;}
  .ag-row.cancel .ag-type,.ag-row.cancel .vs-team{text-decoration:line-through;}

  .ag-main{display:flex;align-items:center;gap:9px;}
  .ag-time{font-family:var(--mono);font-size:12.5px;font-weight:700;color:var(--white);white-space:nowrap;}
  .ag-dot{width:7px;height:7px;border-radius:50%;background:var(--muted);flex-shrink:0;}
  .ag-dot.reserva{background:var(--reserva);}
  .ag-dot.partido{background:var(--partido);}
  .ag-dot.torneo{background:var(--torneo);}
  .ag-dot.clase{background:var(--clase);}
  .ag-type{font-size:12.5px;color:var(--white);flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .ag-tag{font-size:9.5px;font-weight:700;letter-spacing:1px;text-transform:uppercase;padding:3px 8px;border-radius:20px;white-space:nowrap;}
  .ag-tag.past{color:var(--muted);background:rgba(255,255,255,.05);}
  .ag-tag.live{color:var(--black);background:var(--yellow);}
  .ag-tag.future{color:var(--libre);background:rgba(95,184,122,.12);}
  .ag-tag.cancel{color:var(--error);background:rgba(224,85,106,.12);}

  .ag-teams{display:flex;align-items:center;flex-wrap:wrap;gap:7px;margin-top:8px;font-size:12px;}
  .vs-team{color:var(--white);}
  .vs-sep{color:var(--muted);font-size:10px;text-transform:uppercase;letter-spacing:1px;}
  .vs-more{color:var(--muted);font-size:11px;}
  .ag-empty{color:rgba(240,237,230,.3);font-style:italic;}

  .ag-detail{max-height:0;overflow:hidden;transition:max-height .25s ease;}
  .ag-row.open .ag-detail{max-height:400px;margin-top:12px;}
  .det-line{display:flex;gap:10px;padding:6px 0;border-top:1px solid var(--faint);font-size:12px;align-items:flex-start;}
  .det-k{min-width:74px;color:var(--muted);text-transform:uppercase;font-size:10px;letter-spacing:1px;padding-top:3px;}
  .det-v{color:var(--white);}
  .det-v.mono{font-family:var(--mono);font-size:11px;color:var(--muted);word-break:break-all;}
  .det-players{display:flex;flex-wrap:wrap;gap:5px;}
  .pchip{font-size:11px;color:var(--white);background:rgba(255,255,255,.06);padding:3px 8px;border-radius:5px;}

  .foot-note{margin-top:26px;text-align:center;font-size:11px;color:var(--muted);letter-spacing:1px;}
</style>
</head>
<body>

  <div class="topbar">
    <div class="brand">
      <div>
        <div class="brand-title">SOMOS PÁDEL</div>
        <div class="brand-sub">Estado de Canchas</div>
      </div>
    </div>
    <div class="topright">
      <div class="refresh-box">
        <span class="refresh-dot"></span>
        <span id="refresh-text">Actualiza en 20s</span>
      </div>
      <button class="btn" onclick="loadAll()">Actualizar ahora</button>
      <div class="clock" id="clock">--:--:--</div>
    </div>
  </div>

  <div class="summary" id="summary"></div>

  <div class="grid" id="grid"></div>

  <div class="foot-note">PÍCALE REPLAY · datos en vivo desde Playtomic · toca una cancha para abrir su pantalla</div>

<script>
  // ── CONFIG ─────────────────────────────────────────────────────────────────
  var CLOUD = 'https://api.picalereplay.com';
  var REFRESH_SECS = 20;

  // Canchas de Somos Pádel. Para agregar otro club, extiende esta lista.
  var COURTS = [
    { num:1, name:'PÁDEL 1' },
    { num:2, name:'PÁDEL 2' },
    { num:3, name:'PÁDEL 3' },
    { num:4, name:'PÁDEL 4' },
    { num:5, name:'PÁDEL 5' },
    { num:6, name:'PÁDEL 6' },
    { num:7, name:'PÁDEL 7' },
    { num:8, name:'PÁDEL 8' }
  ];

  var STATUS_LABEL = {
    libre:'Libre', reserva:'Reservada', clase:'Clase', partido:'Partido',
    torneo:'Torneo', live:'En vivo', error:'Sin datos', loading:'Cargando'
  };

  var TODAY_BY_COURT = {};  // { "1":[bookings...], ... } de /playtomic/today

  // El backend guarda horarios en UTC SIN zona (ej "2026-08-05T18:00:00").
  // Sin 'Z', el navegador los tomaría como hora local -> mal. Forzamos UTC.
  function parseDT(s){
    if(!s) return null;
    var hasTZ = /[zZ]$|[+\-]\d{2}:?\d{2}$/.test(s);
    return new Date(hasTZ ? s : s + 'Z');
  }
  function hhmm(s){
    var d = parseDT(s);
    return d ? d.toLocaleTimeString('es-MX',{hour:'2-digit',minute:'2-digit'}) : '';
  }

  // ── PRÓXIMAS RESERVAS (desde /today) ──────────────────────────────────────────
  function fetchToday(){
    return fetch(CLOUD + '/api/v1/playtomic/today')
      .then(function(r){ if(!r.ok) throw new Error('HTTP '+r.status); return r.json(); })
      .then(function(d){ TODAY_BY_COURT = (d && d.by_court) ? d.by_court : {}; })
      .catch(function(){ TODAY_BY_COURT = {}; });
  }

  // Próximas N reservas de una cancha: no canceladas y que aún no terminan
  function nextBookings(courtNum, n){
    var list = TODAY_BY_COURT[String(courtNum)] || [];
    var now = new Date();
    return list
      .filter(function(b){ return !b.is_canceled && parseDT(b.end) > now; })
      .sort(function(a,b){ return parseDT(a.start) - parseDT(b.start); })
      .slice(0, n || 3);
  }

  function bookingLabel(b){
    var map = { reserva:'Reserva', partido:'Partido', torneo:'Torneo', clase:'Clase' };
    var t = map[b.display_type] || 'Reserva';
    if (b.activity_name) t = b.activity_name.trim();
    return t;
  }

  // Oculta placeholders tipo "Jugador 2" / "Participante 1"
  function bookingWho(b){
    var p = (b.participants || []).filter(function(x){
      return x && !/^(jugador|participante)\s*\d*$/i.test(x.trim());
    });
    if (!p.length) return '';
    if (p.length <= 2) return p.map(function(s){return s.trim();}).join(', ');
    return p.slice(0,2).map(function(s){return s.trim();}).join(', ') + ' +' + (p.length - 2);
  }

  // Estado actual de la cancha: se calcula desde la agenda del día (cualquier tipo
  // de reserva cuenta como ocupada) + revisión de marcador en vivo.
  function fetchCourt(court){
    var now = new Date();
    var active = (TODAY_BY_COURT[String(court.num)] || []).filter(function(b){
      return !b.is_canceled && parseDT(b.start) <= now && now < parseDT(b.end);
    }).sort(function(a,b){ return parseDT(a.start) - parseDT(b.start); })[0];

    if (!active) return Promise.resolve({ court:court, status:'libre', booking:null, live:false });

    var base = active.display_type;
    var status = ['reserva','partido','torneo','clase'].indexOf(base) >= 0 ? base : 'reserva';

    if (status === 'clase')
      return Promise.resolve({ court:court, status:'clase', booking:active, live:false });

    // partido / torneo / reserva -> ¿hay marcador en vivo?
    return fetch(CLOUD + '/api/v1/score/court/' + court.num + '/now')
      .then(function(r){ return r.ok ? r.json() : {}; })
      .then(function(sd){
        return { court:court, status: sd && sd.match_id ? 'live' : status,
                 booking:active, live: !!(sd && sd.match_id) };
      })
      .catch(function(){ return { court:court, status:status, booking:active, live:false }; });
  }

  // ── RENDER ───────────────────────────────────────────────────────────────────
  function fmtTime(b){
    var s = b.start_time || b.start || b.time || null;
    var e = b.end_time || b.end || null;
    if(!s) return '';
    return e ? (hhmm(s)+' – '+hhmm(e)) : hhmm(s);
  }

  function cardBody(res){
    var b = res.booking;
    if (res.status === 'libre')
      return '<div class="card-primary" style="color:var(--libre)">Disponible</div>'+
             '<div class="card-secondary">Sin reserva ahora</div>';

    if (res.status === 'error')
      return '<div class="card-primary" style="color:var(--error)">Sin conexión</div>'+
             '<div class="card-secondary">No se pudo leer Playtomic</div>';

    if (res.status === 'clase'){
      var act = (b.activity_name || 'Clase');
      var alumno = (b.participants && b.participants[0]) ? b.participants[0] : '—';
      var coach = b.coach_id ? ('Coach #' + b.coach_id) : '';
      return '<div class="card-primary">'+act+'</div>'+
             '<div class="card-secondary">Alumno: '+alumno+(coach?' · '+coach:'')+'</div>';
    }

    // reserva / partido / torneo / live
    var players = (b.participants && b.participants.length)
      ? '<div class="card-players">'+b.participants.slice(0,4).map(function(p){
          return '<span class="player-tag">'+p+'</span>'; }).join('')+'</div>'
      : '<div class="card-secondary">Reserva activa</div>';
    var label = res.live ? 'Marcador en vivo'
      : res.status === 'torneo' ? 'Torneo'
      : res.status === 'reserva' ? 'Reservada'
      : 'Partido';
    var head = '<div class="card-primary"'+(res.live?' style="color:var(--yellow)"':'')+'>'+label+'</div>';
    return head + players;
  }

  var STAT_TAG = { past:'Terminada', live:'En curso', future:'Próxima', cancel:'Cancelada' };
  function statusOf(b){
    var now=new Date(), s=parseDT(b.start), e=parseDT(b.end);
    if(b.is_canceled) return 'cancel';
    if(e && e<now) return 'past';
    if(s && e && s<=now && now<=e) return 'live';
    return 'future';
  }
  function realPlayers(b){
    return (b.participants||[]).filter(function(x){
      return x && !/^(jugador|participante)\s*\d*$/i.test(x.trim());
    }).map(function(x){ return x.trim(); });
  }
  function teamsSummary(b){
    var L=(b.team_left||[]).map(function(x){return x.trim();}).filter(Boolean);
    var R=(b.team_right||[]).map(function(x){return x.trim();}).filter(Boolean);
    L=L.filter(function(x){return !/^(jugador|participante)\s*\d*$/i.test(x);});
    R=R.filter(function(x){return !/^(jugador|participante)\s*\d*$/i.test(x);});
    if(L.length && R.length){
      var extra=realPlayers(b).length-(L.length+R.length);
      return '<span class="vs-team">'+L.join(' / ')+'</span>'+
             '<span class="vs-sep">vs</span>'+
             '<span class="vs-team">'+R.join(' / ')+'</span>'+
             (extra>0?'<span class="vs-more">+'+extra+'</span>':'');
    }
    var p=realPlayers(b);
    return p.length ? '<span class="vs-team">'+p.join(', ')+'</span>' : '<span class="ag-empty">Sin nombres</span>';
  }

  function agendaBlock(courtNum){
    var list=(TODAY_BY_COURT[String(courtNum)]||[]).slice()
      .sort(function(a,b){ return parseDT(a.start)-parseDT(b.start); });
    if(!list.length)
      return '<div class="agenda"><div class="agenda-title">Agenda hoy</div>'+
             '<div class="next-empty">Sin reservas hoy</div></div>';
    var rows=list.map(function(b){
      var st=statusOf(b);
      var players=realPlayers(b);
      var detail='<div class="ag-detail">'+
        (players.length?'<div class="det-line"><span class="det-k">Jugadores</span><span class="det-players">'+
           players.map(function(p){return '<span class="pchip">'+p+'</span>';}).join('')+'</span></div>':'')+
        (b.coach_id?'<div class="det-line"><span class="det-k">Coach</span><span class="det-v">#'+b.coach_id+'</span></div>':'')+
        '<div class="det-line"><span class="det-k">Reserva</span><span class="det-v">'+(b.booking_type||'—')+'</span></div>'+
        '<div class="det-line"><span class="det-k">Origen</span><span class="det-v">'+(b.origin||'—')+'</span></div>'+
        (b.picale_court_id?'<div class="det-line"><span class="det-k">Court ID</span><span class="det-v mono">'+b.picale_court_id+'</span></div>':'')+
      '</div>';
      return '<div class="ag-row '+st+'" onclick="this.classList.toggle(\'open\')">'+
        '<div class="ag-main">'+
          '<span class="ag-time">'+hhmm(b.start)+'–'+hhmm(b.end)+'</span>'+
          '<span class="ag-dot '+b.display_type+'"></span>'+
          '<span class="ag-type">'+bookingLabel(b)+'</span>'+
          '<span class="ag-tag '+st+'">'+STAT_TAG[st]+'</span>'+
        '</div>'+
        '<div class="ag-teams">'+teamsSummary(b)+'</div>'+
        detail+
      '</div>';
    }).join('');
    return '<div class="agenda"><div class="agenda-title">Agenda hoy · '+list.length+'</div>'+rows+'</div>';
  }

  function render(results){
    var grid = document.getElementById('grid');
    grid.innerHTML = results.map(function(res){
      var b = res.booking;
      var t = b ? fmtTime(b) : '';
      return ''+
      '<div class="card '+res.status+'">'+
        '<div class="card-head">'+
          '<div class="card-court">'+res.court.name+'</div>'+
          '<div class="badge '+res.status+'"><span class="badge-dot"></span>'+STATUS_LABEL[res.status]+'</div>'+
        '</div>'+
        '<div class="card-body">'+cardBody(res)+'</div>'+
        agendaBlock(res.court.num)+
        '<div class="card-foot">'+
          '<span>Cancha '+res.court.num+'</span>'+
          '<span class="card-link" onclick="event.stopPropagation();window.open(\'somos-pantalla.html?cancha='+res.court.num+'\',\'_blank\')">Abrir pantalla ↗</span>'+
        '</div>'+
      '</div>';
    }).join('');

    // Resumen
    var counts = { libre:0, clase:0, partido:0, torneo:0, live:0, error:0 };
    results.forEach(function(r){ counts[r.status] = (counts[r.status]||0)+1; });
    var order = [
      ['live','En vivo','var(--live)'],
      ['partido','Partidos','var(--partido)'],
      ['torneo','Torneos','var(--torneo)'],
      ['reserva','Reservadas','var(--reserva)'],
      ['clase','Clases','var(--clase)'],
      ['libre','Libres','var(--libre)'],
      ['error','Sin datos','var(--error)']
    ];
    document.getElementById('summary').innerHTML = order
      .filter(function(o){ return counts[o[0]] > 0 || o[0]==='libre' || o[0]==='live'; })
      .map(function(o){
        return '<div class="chip"><span class="chip-dot" style="background:'+o[2]+'"></span>'+
               '<span class="chip-num" style="color:'+o[2]+'">'+(counts[o[0]]||0)+'</span>'+
               '<span class="chip-label">'+o[1]+'</span></div>';
      }).join('');
  }

  // ── LOAD ─────────────────────────────────────────────────────────────────────
  var countdown = REFRESH_SECS;
  function loadAll(){
    countdown = REFRESH_SECS;
    fetchToday()
      .then(function(){ return Promise.all(COURTS.map(fetchCourt)); })
      .then(render);
  }

  // ── CLOCK + COUNTDOWN ─────────────────────────────────────────────────────────
  function tickClock(){
    document.getElementById('clock').textContent =
      new Date().toLocaleTimeString('es-MX',{hour12:false});
  }
  setInterval(function(){
    tickClock();
    countdown--;
    document.getElementById('refresh-text').textContent =
      countdown > 0 ? ('Actualiza en '+countdown+'s') : 'Actualizando…';
    if (countdown <= 0) loadAll();
  }, 1000);

  // ── INIT ─────────────────────────────────────────────────────────────────────
  // Placeholder de carga
  document.getElementById('grid').innerHTML = COURTS.map(function(c){
    return '<div class="card loading"><div class="card-head">'+
           '<div class="card-court">'+c.name+'</div>'+
           '<div class="badge loading"><span class="badge-dot"></span>Cargando</div></div>'+
           '<div class="card-body"><div class="card-secondary">Consultando Playtomic…</div></div></div>';
  }).join('');
  tickClock();
  loadAll();
</script>
</body>
</html>
