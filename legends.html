/* Partido activo en una cancha, según el motor de marcador de Pícale.
   Devuelve el match_id cuando hay juego, o null. */
function useActiveMatch(n) {
  const [matchId, setMatchId] = useState(null);
  useEffect(() => {
    const id = courtIdOf(n);
    if (!id) return;
    let alive = true;
    const check = () => {
      fetch(`${CLOUD}/api/v1/score/court/${id}/active`).then(r => r.ok ? r.json() : null).then(d => {
        if (alive) setMatchId(d && d.match_id ? d.match_id : null);
      }).catch(() => {});
    };
    check();
    const t = setInterval(check, 20000);
    return () => {
      alive = false;
      clearInterval(t);
    };
  }, [n]);
  return matchId;
}

const slugify = s => s.toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g, "").replace(/[^a-z0-9]+/g, "-").replace(/^-|-$/g, "");

const isSetClosed = (a, b) => a >= 10 ? true : a >= 6 && a - b >= 1;
function buildMatches() {
  const out = [];
  MATCHDAYS.forEach(d => {
    d.pairs.forEach((pair, i) => {
      const id = `${d.div}-j${d.n}-c${i + 1}`;
      const res = RESULTS[id];
      const liv = LIVE[id];
      const sets = liv && liv.sets || res && res.sets || [];
      const teamA = byId(TEAMS, pair[0]) || {
        placeholder: pair[0]
      };
      const teamB = byId(TEAMS, pair[1]) || {
        placeholder: pair[1]
      };
      let setsA = 0,
        setsB = 0;
      sets.forEach(([a, b]) => {
        if (a > b && isSetClosed(a, b)) setsA++;else if (b > a && isSetClosed(b, a)) setsB++;

      const times = rubbers.map(r => r.time).sort();
      const courts = [...new Set(rubbers.map(r => r.court))].sort((a, b) => a - b);
      const status = liv ? "live" : res ? "final" : "scheduled";
      out.push({
        id,
        slug: id,
        matchday: d,
        div: d.div,
        court: courts[0] || i + 1,
        rubbers,
        courts,
        from: times[0] || "",
        to: times[times.length - 1] || "",
        date: d.date,
        teamA,
        teamB,
        sets,
        setsA,
        setsB,
        status,
        winner: status === "final" ? setsA > setsB ? teamA : teamB : null,
        elapsed: liv ? liv.elapsed || 0 : null,
        stream: liv ? liv.stream : null,
        replay: res ? res.replay : null
      });
    });
  });
  return out;
}

}

const divMatches = div => MATCHES.filter(m => m.div === div);
function standings(div) {
  const rows = divTeams(div).map(t => {
    const played = divMatches(div).filter(m => m.status === "final" && (m.teamA.id === t.id || m.teamB.id === t.id));
    let pg = 0,
      pp = 0,
      sf = 0,
      sc = 0;
    played.forEach(m => {
      const home = m.teamA.id === t.id;
      sf += home ? m.setsA : m.setsB;
      sc += home ? m.setsB : m.setsA;
      if (m.winner && m.winner.id === t.id) pg++;else pp++;
    });

      team: t,
      pj: played.length,
      pg,
      pp,
      sf,
      sc,
      dif: sf - sc,
      pts: pg * 3

/* ----------------------------------------------------------------------------
   TIEMPO LOCAL
   Todo se calcula en la hora de Monterrey, no en UTC: si no, a las 7 de la
   noche el navegador ya cree que es el día siguiente y la jornada en curso
   desaparece. Además la noche se considera parte del mismo día hasta las 6 am,
   porque los partidos terminan pasada la medianoche.
---------------------------------------------------------------------------- */
const TZ = "America/Monterrey";
function localNow() {
  try {
    return new Date(new Date().toLocaleString("en-US", {
      timeZone: TZ
    }));
  } catch (e) {
    return new Date();
  }
}
function leagueToday() {
  const d = localNow();
  if (d.getHours() < 6) d.setDate(d.getDate() - 1);
  const p = n => String(n).padStart(2, "0");
  return `${d.getFullYear()}-${p(d.getMonth() + 1)}-${p(d.getDate())}`;
}
const minutesNow = () => {
  const d = localNow();
  return d.getHours() * 60 + d.getMinutes();
};
const toMin = hm => {
  const [h, m] = hm.split(":").map(Number);
  return h * 60 + m;
};

/* Un duelo está en curso desde 15 min antes del primer partido hasta 2 h
   después del último, salvo que ya tenga resultado cargado. */
function refreshLiveStatus() {
  const today = leagueToday();
  const now = minutesNow();
  MATCHES.forEach(m => {
    if (RESULTS[m.id] || LIVE[m.id]) return;
    if (m.date !== today || !m.rubbers.length) {
      m.status = "scheduled";
      return;
    }
    const from = toMin(m.from) - 15;
    const to = toMin(m.to) + 120;
    m.status = now >= from && now <= to ? "live" : "scheduled";
  });
}
refreshLiveStatus();

/* La jornada que sigue: la primera con fecha de hoy en adelante. */
function nextDay(div, onlyStream) {
  const today = leagueToday();
  const days = divDays(div);
  const hit = days.find(d => d.date >= today && (!onlyStream || hasStream(d)));
  return hit || days[days.length - 1];
}
const fmtLong = iso => new Date(iso + "T12:00:00").toLocaleDateString("es-MX", {
  weekday: "long",
  day: "numeric",
  month: "long"
});
const fmtShort = iso => new Date(iso + "T12:00:00").toLocaleDateString("es-MX", {
  day: "2-digit",
  month: "short"
});
const dayLabel = d => d.phase ? d.phase : `Jornada ${d.n}`;

   miércoles por igual, así que esa es la sede por defecto. Para mandar una
   jornada a Cordillera PC basta con ponerle venue:"cordillera". */

function venueOf(d) {
  return d.venue || DEFAULT_VENUE;
}
const hasStream = d => venueOf(d) === "somos";
const venueName = d => {
  const c = LEAGUE.hostClubs.find(h => h.id === venueOf(d));

};

const CSS = `
@import url('https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@400;500;600;700&family=Inter:wght@400;500;600&display=swap');

.lg *, .lg *::before, .lg *::after { box-sizing:border-box; }
.lg {
  --ink:#050506; --panel:#0D0D0F; --panel2:#151519;
  --line:rgba(245,242,236,.10); --line2:rgba(245,242,236,.22);
  --ivory:#F5F2EC; --muted:#8B8B90; --live:#FF3355; --sage:#A7B0A4;
  --div:#22C55E; --div-soft:rgba(34,197,94,.14);
  background:var(--ink); color:var(--ivory);
  font-family:'Inter',system-ui,sans-serif; font-size:15px; line-height:1.55; min-height:100vh; overflow-x:hidden;
  -webkit-font-smoothing:antialiased;
}
.lg.femenil { --div:#FF5CA8; --div-soft:rgba(255,92,168,.14); }
.lg h1,.lg h2,.lg h3 { font-family:'Barlow Condensed',sans-serif; font-weight:700; line-height:.95; margin:0; }
.lg p{margin:0}
.lg button { font:inherit; color:inherit; background:none; border:0; cursor:pointer; }
.lg a { color:inherit; text-decoration:none; }
.lg :focus-visible { outline:2px solid var(--div); outline-offset:3px; }
.wrap { max-width:1180px; margin:0 auto; padding:0 18px; }

/* nav */
.nav { position:sticky; top:0; z-index:40; background:rgba(5,5,6,.9); backdrop-filter:blur(14px); border-bottom:1px solid var(--line); }
.nav-in { display:flex; align-items:center; gap:18px; height:66px; }
.nav-links { display:none; gap:18px; }
.nav-link { font-size:13.5px; color:var(--muted); padding:6px 0; border-bottom:2px solid transparent; }
.nav-link:hover{ color:var(--ivory); }
.nav-link.on { color:var(--ivory); border-bottom-color:var(--div); }
.nav-right { margin-left:auto; display:flex; align-items:center; gap:14px; }
.picale-tag { display:none; align-items:center; gap:7px; font-size:11px; color:var(--muted); letter-spacing:.04em; }
.burger { display:grid; gap:4px; padding:8px; }
.burger i { width:20px; height:1.5px; background:var(--ivory); display:block; }
.sheet { border-top:1px solid var(--line); background:var(--panel); }
.sheet button { display:block; width:100%; text-align:left; padding:13px 18px; border-bottom:1px solid var(--line); font-size:15px; }

/* switch de división */
.divbar { border-bottom:1px solid var(--line); background:var(--panel); }
.divbar-in { display:flex; align-items:center; gap:12px; height:50px; }
.divseg { display:inline-flex; gap:3px; padding:3px; background:var(--panel2); border:1px solid var(--line); border-radius:999px; }
.divbtn { padding:6px 18px; border:0; border-radius:999px; font-family:'Barlow Condensed',sans-serif;
  font-size:16px; font-weight:600; letter-spacing:.08em; color:var(--muted); transition:background .18s,color .18s; }
.divbtn:hover { color:var(--ivory); }
.divbtn.on { color:#0B0B0C; }
.divbtn.on.varonil { background:#22C55E; }
.divbtn.on.femenil { background:#FF5CA8; }
.divbar .meta { margin-left:auto; font-size:11.5px; color:var(--muted); letter-spacing:.05em; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }

/* hero */
.hero { padding:44px 0 34px; border-bottom:1px solid var(--line); }
.hero-grid { display:grid; gap:30px; }
.hero-mark { margin-bottom:22px; }
.hero-lede { color:var(--muted); max-width:46ch; margin-top:16px; }
.hero-season { font-family:'Barlow Condensed',sans-serif; font-size:clamp(26px,7vw,44px); font-weight:700; letter-spacing:.02em; }
.hero-season b { color:var(--div); font-weight:700; }
.cta-row { display:flex; flex-wrap:wrap; gap:10px; margin-top:24px; }
.btn { display:inline-flex; align-items:center; gap:9px; padding:12px 20px; border:1px solid var(--line2); font-size:13.5px; }
.btn:hover { background:rgba(245,242,236,.06); }
.btn-live { background:var(--live); border-color:var(--live); color:#fff; font-weight:600; }
.btn-div { background:var(--div); border-color:var(--div); color:#0B0B0C; font-weight:600; }
.btn-sm { padding:8px 14px; font-size:12.5px; }
.brands { display:flex; align-items:center; gap:14px; flex-wrap:wrap; margin-top:26px; padding-top:22px; border-top:1px solid var(--line); }
.brands span { color:var(--muted); font-size:18px; font-family:'Barlow Condensed',sans-serif; }

.dot { width:7px; height:7px; border-radius:50%; background:var(--live); animation:pulse 2s infinite; flex:none; }
@keyframes pulse { 50%{opacity:.25} }

/* secciones */
.sec { padding:42px 0; border-bottom:1px solid var(--line); }
.sec-head { display:flex; align-items:flex-end; justify-content:space-between; gap:16px; margin-bottom:20px; }
.sec-title { font-size:clamp(26px,6vw,38px); }
.sec-note { font-size:12.5px; color:var(--muted); margin-top:6px; }
.sec-link { font-size:12.5px; color:var(--div); white-space:nowrap; border-bottom:1px solid currentColor; padding-bottom:2px; }

/* fixture */
.fixtures { display:grid; gap:9px; }
.fx { display:grid; grid-template-columns:52px 1fr; border:1px solid var(--line); background:var(--panel); width:100%; text-align:left; }
.fx:hover { border-color:var(--line2); background:var(--panel2); }
.fx.is-live { border-left:2px solid var(--live); }
.fx.no-stream { opacity:.6; border-style:dashed; }
.fx.no-stream:hover { opacity:.85; }
.fx-court { display:flex; flex-direction:column; align-items:center; justify-content:center; gap:2px; border-right:1px solid var(--line); padding:14px 0; }
.fx-court b { font-family:'Barlow Condensed',sans-serif; font-size:24px; line-height:1; }
.fx-court span { font-size:9px; color:var(--muted); letter-spacing:.08em; }
.fx-body { padding:11px 14px; display:grid; gap:9px; }
.fx-meta { display:flex; align-items:center; gap:9px; flex-wrap:wrap; font-size:11.5px; color:var(--muted); }
.fx-row { display:grid; grid-template-columns:1fr auto; align-items:center; gap:12px; width:100%; text-align:left; }
.fx-side { display:flex; align-items:center; gap:10px; min-width:0; }
.fx-side.lost { opacity:.55; }
.fx-bar { width:3px; height:24px; flex:none; }
.fx-team { font-family:'Barlow Condensed',sans-serif; font-size:19px; font-weight:600; line-height:1.1; }
.fx-team.ph { color:var(--muted); font-weight:500; font-style:italic; }
.fx-sets { display:flex; gap:4px; }
.fx-sets b { min-width:26px; text-align:center; font-family:'Barlow Condensed',sans-serif; font-size:19px; font-weight:700; font-variant-numeric:tabular-nums; color:var(--muted); }
.fx-sets b.won { color:var(--ivory); }
.fx-sets b.cur { color:var(--live); }
.fx-foot { display:flex; align-items:center; justify-content:space-between; gap:10px; padding-top:8px; border-top:1px solid var(--line); font-size:12px; color:var(--muted); }
.fx-cta { color:var(--div); }
.fx-cta.livec { color:var(--live); }

.chip { display:inline-flex; align-items:center; gap:6px; padding:3px 9px; font-size:10.5px; font-weight:600; letter-spacing:.08em; border:1px solid var(--line); color:var(--muted); }
.chip.live { color:var(--live); border-color:rgba(255,51,85,.4); background:rgba(255,51,85,.12); }
.chip.final { color:var(--sage); }
.chip.sched { color:var(--div); border-color:currentColor; }

/* tabla */
.tbl { width:100%; border-collapse:collapse; font-size:14px; }
.tbl th { font-family:'Barlow Condensed',sans-serif; font-size:13px; letter-spacing:.1em; color:var(--muted); text-align:right; padding:0 0 10px; border-bottom:1px solid var(--line); font-weight:600; }
.tbl th:nth-child(1),.tbl th:nth-child(2){ text-align:left; }
.tbl td { padding:11px 0; border-bottom:1px solid var(--line); text-align:right; font-variant-numeric:tabular-nums; }
.tbl td:nth-child(1),.tbl td:nth-child(2){ text-align:left; }
.tbl tr:hover td { background:rgba(245,242,236,.03); }
.pos { font-family:'Barlow Condensed',sans-serif; font-size:18px; font-weight:700; color:var(--muted); width:32px; }
.pos.top { color:var(--div); }
.tpts { font-family:'Barlow Condensed',sans-serif; font-size:19px; font-weight:700; }
.tbl .hide-sm { display:none; }
.cut { border-bottom:1px dashed var(--line2)!important; }

/* tarjetas */
.grid { display:grid; gap:10px; }
.g2 { grid-template-columns:1fr; }
.g3 { grid-template-columns:repeat(2,1fr); }
.card { border:1px solid var(--line); background:var(--panel); padding:15px; text-align:left; width:100%; }
.card:hover { border-color:var(--line2); background:var(--panel2); }
.team-top { display:flex; align-items:center; gap:12px; }
.crest { width:42px; height:42px; flex:none; display:grid; place-items:center; border:1px solid var(--line2); font-family:'Barlow Condensed',sans-serif; font-weight:700; font-size:15px; }
.team-name { font-family:'Barlow Condensed',sans-serif; font-size:20px; font-weight:600; line-height:1.05; }
.team-sub { font-size:11.5px; color:var(--muted); }
.team-stats { display:flex; gap:16px; font-size:11.5px; color:var(--muted); border-top:1px solid var(--line); padding-top:10px; margin-top:12px; }
.team-stats b { font-family:'Barlow Condensed',sans-serif; font-size:16px; color:var(--ivory); display:block; font-weight:700; }

/* filtros */
.filters { display:grid; gap:10px; margin-bottom:20px; padding:13px; border:1px solid var(--line); background:var(--panel); }
.frow { display:flex; align-items:center; gap:7px; flex-wrap:wrap; }
.flabel { font-size:11px; color:var(--muted); letter-spacing:.1em; min-width:70px; }
.fbtn { padding:5px 10px; border:1px solid var(--line); font-size:12.5px; color:var(--muted); }
.fbtn:hover { color:var(--ivory); }
.fbtn.on { background:var(--ivory); color:#0B0B0C; border-color:var(--ivory); font-weight:600; }
.fclear { margin-left:auto; font-size:12px; color:var(--div); }

/* páginas internas */
.mp-head { padding:26px 0 20px; border-bottom:1px solid var(--line); }
.back { font-size:12.5px; color:var(--muted); margin-bottom:14px; display:inline-block; }
.mp-title { font-size:clamp(28px,7.5vw,50px); }
.mp-meta { display:flex; flex-wrap:wrap; align-items:center; gap:10px; margin-top:11px; font-size:12.5px; color:var(--muted); }
.blk { padding:24px 0; border-bottom:1px solid var(--line); }
.sub { font-family:'Barlow Condensed',sans-serif; font-size:21px; font-weight:600; margin-bottom:13px; }
.hero-stats { display:grid; grid-template-columns:repeat(2,1fr); gap:1px; background:var(--line); border:1px solid var(--line); margin-top:18px; }
.hs { background:var(--panel); padding:13px; }
.hs b { display:block; font-family:'Barlow Condensed',sans-serif; font-size:28px; font-weight:700; line-height:1; }
.hs span { font-size:10.5px; color:var(--muted); letter-spacing:.06em; }

.score-board { border:1px solid var(--line); background:var(--panel); margin:22px 0; }
.sb-row { display:grid; grid-template-columns:1fr auto; align-items:center; gap:14px; padding:15px; }
.sb-row + .sb-row { border-top:1px solid var(--line); }
.sb-name { font-family:'Barlow Condensed',sans-serif; font-size:clamp(20px,5.5vw,30px); font-weight:700; line-height:1; }
.sb-sets { display:flex; gap:6px; }
.sb-sets b { min-width:36px; text-align:center; font-family:'Barlow Condensed',sans-serif; font-size:clamp(26px,7vw,38px); font-weight:700; color:var(--muted); font-variant-numeric:tabular-nums; }
.sb-sets b.won { color:var(--ivory); }
.sb-sets b.cur { color:var(--live); }
.sb-foot { display:flex; justify-content:space-between; gap:12px; padding:10px 15px; border-top:1px solid var(--line); background:var(--panel2); font-size:12px; color:var(--muted); }

.court { position:relative; background:#08080A; border:1px solid var(--line); }
.court svg { display:block; width:100%; height:auto; }
.court-stage { position:relative; width:100%; }
.court-video { display:block; width:100%; aspect-ratio:16/9; background:#000; }

/* pantalla completa: el contenedor entero, con el marcador encima */
.court.full { position:fixed; inset:0; z-index:999; background:#000; border-radius:0;
  display:grid; place-items:center; }
.court.full .court-stage { width:min(100vw, calc(100vh * 16 / 9)); }
.court.full .court-cam { bottom:16px; right:20px; }

.vctrl { position:absolute; bottom:10px; left:10px; display:flex; gap:6px; z-index:3; }
.vctrl button { width:34px; height:34px; display:grid; place-items:center; font-size:14px;
  background:rgba(8,8,10,.62); border:1px solid rgba(245,242,236,.18); border-radius:8px;
  color:var(--ivory); backdrop-filter:blur(6px); }
.vctrl button:hover { background:rgba(8,8,10,.85); }
.vctrl svg { width:17px; height:17px; }
.court.full .vctrl { bottom:18px; left:20px; }
.score-ovl { position:absolute; inset:0; overflow:hidden; pointer-events:none; z-index:2; }
.score-ovl iframe { width:1920px; height:1080px; border:0; background:transparent;
  transform-origin:top left; pointer-events:none; }

.court-off { position:absolute; left:0; right:0; top:40%; text-align:center; font-size:12.5px; color:var(--muted); pointer-events:none; }
.court-off button { pointer-events:auto; }
.court-off span { display:block; padding:0 12px; }
.retry { margin-top:9px; padding:5px 12px; border:1px solid var(--line2); font-size:11.5px; color:var(--ivory); }
.retry:hover { background:rgba(245,242,236,.08); }
.court-badge { position:absolute; top:10px; left:10px; display:flex; align-items:center; gap:6px; padding:5px 9px; background:rgba(255,51,85,.92); color:#fff; font-size:10.5px; font-weight:600; letter-spacing:.08em; }
.court-cam { position:absolute; bottom:9px; right:11px; font-size:10.5px; color:var(--muted); }

.order { display:grid; gap:8px; }
.ord { display:grid; grid-template-columns:76px 1fr; gap:12px; align-items:center;
  border:1px solid var(--line); background:var(--panel); border-radius:10px; padding:12px 14px; }
.ord-when { text-align:center; border-right:1px solid var(--line); padding-right:10px; }
.ord-when b { display:block; font-family:'Barlow Condensed',sans-serif; font-size:22px; font-weight:700; line-height:1; }
.ord-when span { display:block; font-size:10px; color:var(--muted); letter-spacing:.06em; margin-top:3px; }
.ord-cat { display:inline-block; font-size:10px; letter-spacing:.12em; color:var(--muted); margin-bottom:7px; text-transform:uppercase; }
.ord-side { display:flex; align-items:center; gap:9px; font-size:14px; padding:2px 0; }
.ord-side i { width:3px; height:15px; flex:none; display:block; }
.ord-cta { grid-column:1/-1; text-align:left; font-size:12px; color:var(--div); padding-top:9px; border-top:1px solid var(--line); }
@media (min-width:760px){
  .ord { grid-template-columns:76px 1fr auto; }
  .ord-cta { grid-column:auto; border-top:0; padding-top:0; }
}

.empty { padding:30px 16px; text-align:center; border:1px dashed var(--line2); color:var(--muted); font-size:14px; }
.empty b { display:block; color:var(--ivory); font-family:'Barlow Condensed',sans-serif; font-size:19px; margin-bottom:6px; font-weight:600; }

.pathpill { display:flex; align-items:center; gap:9px; padding:8px 11px; border:1px solid var(--line); background:var(--panel); font-size:11.5px; color:var(--muted); }
.pathpill code { font-family:'Inter',sans-serif; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.pathpill button { color:var(--div); white-space:nowrap; }

/* publicidad */
.ad { position:relative; display:flex; align-items:center; justify-content:center; padding:22px 16px; border:1px solid var(--line); background:var(--panel); text-align:center; }
.ad-leaderboard { min-height:100px; } .ad-banner { min-height:88px; } .ad-court { min-height:72px; border-top:0; }
.ad-tag { position:absolute; top:7px; left:10px; font-size:9px; letter-spacing:.14em; color:var(--muted); }
.ad-size { position:absolute; bottom:7px; right:10px; font-size:9px; color:var(--muted); }
.ad-fallback b { display:block; font-family:'Barlow Condensed',sans-serif; font-size:clamp(19px,5vw,25px); font-weight:700; }
.ad-fallback > span { display:block; margin-top:4px; font-size:12px; color:var(--muted); }
.ad img { max-width:80%; max-height:54px; width:auto; object-fit:contain; }
.ad-court img { max-height:38px; }
.rail { border-top:1px solid var(--line); border-bottom:1px solid var(--line); padding:18px 0; margin-top:24px; }
.rail-h { display:block; font-size:10.5px; letter-spacing:.14em; color:var(--muted); margin-bottom:11px; }
.rail-list { display:flex; flex-wrap:wrap; gap:8px; }
.rail-logo { display:flex; align-items:center; padding:10px 18px; border:1px solid var(--line); }
.rail-logo img { height:26px; width:auto; display:block; }

/* pie */
.foot { padding:40px 0 96px; }
.lockup { display:flex; align-items:center; gap:18px; flex-wrap:wrap; }
.lockup i { font-style:normal; font-family:'Barlow Condensed',sans-serif; font-size:20px; color:var(--muted); }
.foot-note { margin-top:16px; font-size:12.5px; color:var(--muted); max-width:62ch; }
.foot-links { display:flex; flex-wrap:wrap; gap:15px; margin-top:18px; font-size:12.5px; color:var(--muted); }

/* barra inferior móvil */
.bnav { position:fixed; left:0; right:0; bottom:0; z-index:50; display:grid; grid-template-columns:repeat(6,1fr); background:rgba(5,5,6,.95); backdrop-filter:blur(14px); border-top:1px solid var(--line); }
.bnav button { padding:9px 2px 11px; display:grid; justify-items:center; gap:4px; font-size:10px; color:var(--muted); }
.bnav button.on { color:var(--ivory); }
.bnav button.on .bi { border-color:var(--div); color:var(--div); }
.bi { width:22px; height:22px; display:grid; place-items:center; }
.bi svg { width:21px; height:21px; }
.bdot { position:absolute; top:0; left:50%; transform:translateX(-50%); width:22px; height:2px; background:var(--div); }
.bnav button { position:relative; }

@media (min-width:760px){
  .g2{ grid-template-columns:1fr 1fr; } .g3{ grid-template-columns:repeat(3,1fr); }
  .fx{ grid-template-columns:62px 1fr; }
  .tbl .hide-sm{ display:table-cell; }
  .hero-stats{ grid-template-columns:repeat(4,1fr); }
  .picale-tag{ display:flex; }
}
@media (min-width:1000px){
  .nav-links{ display:flex; } .burger{ display:none; } .bnav{ display:none; }
  .hero{ padding:64px 0 48px; } .hero-grid{ grid-template-columns:1.1fr .9fr; align-items:center; }
  .foot{ padding-bottom:40px; } .sec{ padding:56px 0; }
}
/* ---------------------------------------------------------------
   CELULAR — la página se comporta como app: menos cromo, filtros
   deslizables y zonas táctiles de al menos 44 px.
--------------------------------------------------------------- */

  .lg { font-size:15.5px; }
  .wrap { padding:0 14px; }

  .nav-in { height:58px; gap:12px; }
  .nav-in > button:first-child img { height:34px!important; }
  .burger { padding:10px; margin-right:-8px; }
  .sheet button { padding:16px 18px; font-size:16px; }

  .divbar-in { height:46px; gap:8px; }
  .divbtn { padding:8px 16px; font-size:16px; }
  .divbar .meta { font-size:11px; }

  .hero { padding:24px 0 26px; }
  .hero-mark { margin-bottom:16px; }
  .hero-mark img { height:auto!important; width:min(220px,64vw); }
  .hero-season { font-size:26px; }
  .hero-lede { font-size:15px; margin-top:14px; }
  .cta-row { gap:8px; margin-top:20px; }
  .cta-row .btn { flex:1 1 100%; justify-content:center; padding:14px 18px; }
  .brands { gap:10px; margin-top:20px; padding-top:18px; }
  .brands img { height:auto!important; max-height:26px; max-width:38vw; }

  .sec { padding:30px 0; }
  .sec-head { flex-direction:column; align-items:flex-start; gap:8px; margin-bottom:16px; }
  .sec-title { font-size:29px; }
  .mp-head { padding:18px 0 16px; }
  .mp-title { font-size:32px; }
  .blk { padding:20px 0; }
  .sub { font-size:20px; }

  .filters { padding:12px 0 12px 12px; }
  .frow { flex-wrap:nowrap; overflow-x:auto; scrollbar-width:none; padding-right:12px; }
  .frow::-webkit-scrollbar { display:none; }
  .flabel { min-width:auto; padding-right:4px; }
  .fbtn { padding:9px 14px; font-size:13.5px; white-space:nowrap; }
  .fclear { padding:9px 0; }

  .fx { grid-template-columns:46px 1fr; }
  .fx-court b { font-size:22px; }
  .fx-body { padding:11px 12px; }
  .fx-team { font-size:18px; }
  .fx-meta { font-size:11px; gap:7px; }
  .fx-foot { font-size:11.5px; }
  .fx-sets b { min-width:23px; font-size:19px; }

  .card { padding:13px; }
  .team-name { font-size:19px; }
  .hero-stats { grid-template-columns:repeat(2,1fr); }
  .hs b { font-size:26px; }

  .tbl { font-size:13.5px; }
  .tbl th { font-size:11px; padding:0 6px 9px 0; }
  .tbl td { padding:11px 6px 11px 0; }
  .tbl th:last-child, .tbl td:last-child { padding-right:0; }
  .pos { width:24px; font-size:16px; }

  .btn { padding:12px 18px; }
  .btn-sm { padding:10px 14px; }
  .sec-link { padding:6px 0; }
  .pathpill code { font-size:11px; }

  .ad { padding:20px 12px; }
  .ad img { max-height:42px; max-width:70%; }

  .lockup { gap:12px; }
  .lockup img { height:auto!important; max-height:32px; max-width:40vw; }
  .lockup i { font-size:17px; }
  .foot { padding:32px 0 calc(88px + env(safe-area-inset-bottom)); }
  .foot-links { gap:14px; }
  .foot-links button { padding:5px 0; }

  .bnav { padding-bottom:env(safe-area-inset-bottom); }
  .bnav button { padding:9px 1px 10px; font-size:9.5px; gap:3px; }

@media (max-width:359px){
  .bnav button { font-size:9px; }

/* ---------------------------------------------------------------
   ACABADO
--------------------------------------------------------------- */
.card, .fx, .court, .ad, .filters, .empty, .score-board, .monitor, .pathpill, .hero-stats {
  border-radius:10px;
}
.court { overflow:hidden; }
.court-video { border-radius:10px 10px 0 0; }
.card { box-shadow:inset 0 1px 0 rgba(245,242,236,.045); }
.fx { box-shadow:inset 0 1px 0 rgba(245,242,236,.04); overflow:hidden; }
.crest, .avatar { border-radius:8px; }
.btn { border-radius:8px; }
.chip, .fbtn { border-radius:999px; }
.chip.live { box-shadow:0 0 0 1px rgba(255,51,85,.12), 0 0 18px -6px rgba(255,51,85,.7); }
.court-badge { border-radius:999px; }
.hs:first-child { border-top-left-radius:10px; }
.hs:last-child { border-bottom-right-radius:10px; }

@media (max-width:759px){
  /* jerarquía tipo app: encabezado compacto, contenido protagonista */
  .nav { border-bottom:0; box-shadow:0 1px 0 var(--line); }
  .divbar { border-bottom:0; box-shadow:0 1px 0 var(--line); }
  .divbar .meta { display:none; }

  .hero-kicker, .hero-eyebrow { font-size:10.5px; letter-spacing:.2em; color:var(--muted); }
  .hero-season { font-size:22px; letter-spacing:.04em; }

  .cta-row .btn:first-child { flex:1 1 100%; }
